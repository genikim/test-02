<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(가상) 행정정보 통합관리 기본법 - 검색 및 열람 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-area">
                <span class="badge">행정안전부 디지털정부실</span>
                <h1>(가상) 행정정보 통합관리 기본법</h1>
                <p class="subtitle">[시행 2026. 7. 1.] [법률 제99999호, 2026. 6. 1., 가상 제정]</p>
            </div>
            <div class="search-box-container">
                <div class="search-input-wrapper">
                    <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: 공동활용, 데이터 표준, 행정안전부장관...)" autocomplete="off">
                    <button type="button" id="clearBtn" class="clear-btn">&times;</button>
                </div>
                <div class="status-bar">
                    <span id="resultCount" class="result-count">결과 계산 중...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div id="cardGrid" class="card-grid">
            <!-- 조항 카드가 JavaScript에 의해 동적으로 생성됩니다. -->
        </div>
        <div id="noResults" class="no-results hidden">
            <p>검색 결과가 없습니다.</p>
        </div>
    </main>

    <footer class="footer">
        <p>행정안전부 디지털정부실 | 행정정보 통합관리 기본법 조항 검색 시스템</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
